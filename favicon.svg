<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5e61d"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Boxy Badge -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#060b13" stroke="url(#crestGrad)" stroke-width="2.5" />
  
  <!-- Node 1 Block -->
  <rect x="11" y="22" width="16" height="20" rx="3" fill="#0d1f33" stroke="#b5e61d" stroke-width="2"/>
  <text x="19" y="36" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">L</text>
  
  <!-- Arrow Link -->
  <path d="M28 32 L36 32 M33 28 L37 32 L33 36" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Node 2 Block -->
  <rect x="37" y="22" width="16" height="20" rx="3" fill="#0d1f33" stroke="#0284c7" stroke-width="2"/>
  <text x="45" y="36" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">L</text>
  
  <!-- Pulse Dot -->
  <circle cx="53" cy="11" r="3" fill="#b5e61d" filter="url(#glow)"/>
</svg>
